version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: footage-brain-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount your drives as read-only volumes for scanning
      # Example: - "D:/Videos:/mnt/videos:ro"
      # Add your drive paths here:
      - "./data:/app/data"
      - "./footage_brain.db:/app/footage_brain.db"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/footage_brain.db
      - THUMBNAILS_DIR=/app/data/thumbnails
      - KEYFRAMES_DIR=/app/data/keyframes
      - CHROMA_DIR=/app/data/chroma
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - EMBED_MODEL=${EMBED_MODEL:-all-MiniLM-L6-v2}
      - INGEST_WORKERS=${INGEST_WORKERS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: footage-brain-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
